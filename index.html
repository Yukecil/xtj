<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>挑码助手</title>
  <meta name="theme-color" content="#f5f5f5">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      background: #fff;
      border-bottom: 1px solid #ececec;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 23px;
      font-weight: 700;
      color: #333;
      cursor: pointer;
    }

    .info-panel {
      padding: 15px;
      background: #fff;
    }
    .selected-display {
      position: relative;
      height: 310px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #dedede;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    #selectedText {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 20px;
      font-size: 19px;
      line-height: 34px;
      color: #333;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #selectedText::placeholder {
      color: #bbb;
    }

    .action-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 15px 18px;
      background: #fff;
    }
    .action-bar button {
      height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.12s;
    }
    .action-bar button:active {
      transform: scale(0.94);
      opacity: 0.85;
    }
    .action-bar .btn-delete {
      background: #ff5d88;
      color: #fff;
    }
    .action-bar .btn-copy {
      background: #ff5d88;
      color: #fff;
    }
    .action-bar .btn-save {
      background: #ff5d88;
      color: #fff;
    }
    .action-bar .btn-clear {
      background: #fff;
      border: 2px solid #ff5d88;
      color: #ff5d88;
    }
    .action-bar .btn-history {
      background: #ff5d88;
      color: #fff;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      padding: 18px;
      padding-bottom: 40px;
      background: #fff;
    }
    .btn-grid button {
      height: 52px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #dcdcdc;
      font-size: 19px;
      font-weight: 600;
      color: #333;
      transition: 0.1s;
      box-shadow: none;
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .btn-grid button:active {
      transform: scale(0.92);
    }
    .btn-grid button.flash {
      animation: flashBtn 0.25s ease;
    }
    @keyframes flashBtn {
      0% { background: #ff5d88; border-color: #ff5d88; color: #fff; transform: scale(0.92); }
      100% { background: #fff; border-color: #dcdcdc; color: #333; transform: scale(1); }
    }

    .result-wrapper {
      margin: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #fafafa;
      border: 1px solid #eee;
    }
    .result-wrapper::-webkit-scrollbar {
      width: 3px;
    }
    .result-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .result-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
    }

    .result-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #ececec;
      margin-bottom: 10px;
    }
    .result-card:last-child {
      margin-bottom: 0;
    }
    .result-card .r-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.25);
      margin-bottom: 6px;
    }
    .result-card .r-items {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .result-card .r-items span {
      padding: 3px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.03);
      font-size: 13px;
      color: #555;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }
    .result-card .r-items span.hot {
      background: rgba(255, 93, 136, 0.08);
      border-color: rgba(255, 93, 136, 0.15);
      color: #ff5d88;
    }
    .result-card .r-count {
      font-weight: 600;
      font-size: 12px;
      color: #ff5d88;
    }
    .empty-result {
      padding: 20px;
      text-align: center;
      color: rgba(0, 0, 0, 0.12);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 40, 40, 0.92);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 15px;
      border: none;
      z-index: 99999;
      animation: toastIn 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100000;
      padding: 16px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal-content {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 380px;
      max-height: 75vh;
      max-height: 75dvh;
      overflow-y: auto;
    }
    .modal-content::-webkit-scrollbar {
      width: 3px;
    }
    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      color: #333;
    }
    .modal-content .history-item {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 4px;
      border: 1px solid rgba(0, 0, 0, 0.03);
      cursor: pointer;
      transition: 0.1s;
    }
    .modal-content .history-item:active {
      background: rgba(0, 0, 0, 0.05);
    }
    .modal-content .history-time {
      font-size: 9px;
      color: rgba(0, 0, 0, 0.2);
    }
    .modal-content .history-text {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.4);
      margin: 3px 0;
    }
    .modal-close-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
      color: #888;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.1s;
    }
    .modal-close-btn:active {
      background: rgba(0, 0, 0, 0.08);
    }
    .history-clear-btn {
      padding: 4px 14px;
      border: 1px solid rgba(231, 76, 60, 0.1);
      border-radius: 4px;
      background: rgba(231, 76, 60, 0.04);
      color: #e74c3c;
      font-size: 10px;
      cursor: pointer;
      transition: 0.1s;
    }
    .history-clear-btn:active {
      background: rgba(231, 76, 60, 0.08);
    }
    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    @media (max-width: 400px) {
      .btn-grid {
        gap: 8px;
        padding: 12px;
        padding-bottom: 30px;
      }
      .btn-grid button {
        height: 44px;
        font-size: 16px;
        border-radius: 12px;
      }
      .action-bar {
        gap: 8px;
        padding: 12px 14px;
      }
      .action-bar button {
        height: 38px;
        font-size: 12px;
      }
      .header-title {
        font-size: 19px;
      }
      .selected-display {
        height: 220px;
      }
      #selectedText {
        font-size: 16px;
        line-height: 28px;
        padding: 14px;
      }
    }
    @media (max-width: 360px) {
      .btn-grid {
        gap: 5px;
        padding: 8px;
        padding-bottom: 20px;
      }
      .btn-grid button {
        height: 38px;
        font-size: 13px;
        border-radius: 10px;
      }
      .action-bar {
        gap: 5px;
        padding: 10px 12px;
      }
      .action-bar button {
        height: 34px;
        font-size: 11px;
        border-radius: 8px;
      }
      .selected-display {
        height: 180px;
      }
      #selectedText {
        font-size: 14px;
        line-height: 24px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
<div class="container">

    <div class="header-title" id="titleBtn">挑码助手</div>
  </div>

    <button data-value="蓝单">蓝单</button>
    <button data-value="蓝双">蓝双</button>

<script>
  const CATEGORY_MAP = {
    '单': '单双大小', '双': '单双大小', '大单': '单双大小', '大双': '单双大小',
    '合单': '单双大小', '合双': '单双大小', '大': '单双大小', '小': '单双大小',
    '小单': '单双大小', '小双': '单双大小', '合大': '单双大小', '合小': '单双大小',
    '金': '五行', '木': '五行', '水': '五行', '火': '五行', '土': '五行',
    '红波': '波色', '蓝波': '波色', '绿波': '波色',
    '家禽': '家禽野兽', '野兽': '家禽野兽',
    '红单': '波色单双', '红双': '波色单双', '蓝单': '波色单双', '蓝双': '波色单双',
    '绿单': '波色单双', '绿双': '波色单双',
    '鼠': '生肖', '牛': '生肖', '虎': '生肖', '兔': '生肖', '龙': '生肖',
    '蛇': '生肖', '马': '生肖', '羊': '生肖', '猴': '生肖', '鸡': '生肖',
    '狗': '生肖', '猪': '生肖',
    '0尾': '尾数', '1尾': '尾数', '2尾': '尾数', '3尾': '尾数', '4尾': '尾数',
    '5尾': '尾数', '6尾': '尾数', '7尾': '尾数', '8尾': '尾数', '9尾': '尾数',
    '大尾': '尾数', '小尾': '尾数',
    '0头': '头数', '1头': '头数', '2头': '头数', '3头': '头数', '4头': '头数',
    '1门': '门数', '2门': '门数', '3门': '门数', '4门': '门数', '5门': '门数',
    '1段': '段数', '2段': '段数', '3段': '段数', '4段': '段数',
    '5段': '段数', '6段': '段数', '7段': '段数',
    '1合': '合数', '2合': '合数', '3合': '合数', '4合': '合数',
    '5合': '合数', '6合': '合数', '7合': '合数', '8合': '合数',
    '9合': '合数', '10合': '合数', '11合': '合数', '12合': '合数', '13合': '合数',
    '0头单': '头单双', '1头单': '头单双', '2头单': '头单双', '3头单': '头单双', '4头单': '头单双',
    '0头双': '头单双', '1头双': '头单双', '2头双': '头单双', '3头双': '头单双', '4头双': '头单双'
  };

  let selectedList = [];
  let currentResult = [];
  let toastTimer = null;

  const textarea = document.getElementById('selectedText');
  const resultEl = document.getElementById('result');

  function toast(text) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    if (toastTimer) clearTimeout(toastTimer);
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerText = text;
    document.body.appendChild(el);
    toastTimer = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s';
      setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
    }, 1500);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('✅ 已复制')).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('✅ 已复制'); } catch (e) { toast('❌ 复制失败'); }
    document.body.removeChild(ta);
  }

  function getTimeStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function addItem(value) {
    selectedList.push(value);
    updateUI();
    doStats();
    // 按钮闪一下
    document.querySelectorAll('.btn-grid button').forEach(function(btn) {
      if (btn.dataset.value === value) {
        btn.classList.remove('flash');
        void btn.offsetWidth;
        btn.classList.add('flash');
        setTimeout(function() {
          btn.classList.remove('flash');
        }, 300);
      }
    });
  }

  function deleteLastItem() {
    if (selectedList.length === 0) {
      toast('⚠️ 没有可删除的');
      return;
    }
    var removed = selectedList.pop();
    updateUI();
    doStats();
    toast('➖ 已删除: ' + removed);
  }

  function updateUI() {
    if (selectedList.length === 0) {
      textarea.value = '';
    } else {
      textarea.value = selectedList.join('、');
    }
  }

  function clearAll() {
    if (selectedList.length === 0) {
      toast('⚠️ 没有数据');
      return;
    }
    selectedList = [];
    updateUI();
    resultEl.innerHTML = '<div class="empty-result">选号后自动统计</div>';
    currentResult = [];
    toast('🗑️ 已清空');
  }

  function doStats() {
    if (selectedList.length === 0) {
      resultEl.innerHTML = '<div class="empty-result">选号后自动统计</div>';
      currentResult = [];
      return;
    }
    // 统计频次
    var countMap = {};
    selectedList.forEach(function(item) {
      if (!countMap[item]) countMap[item] = 0;
      countMap[item]++;
    });

    var groups = {};
    for (var name in countMap) {
      var count = countMap[name];
      var cat = CATEGORY_MAP[name] || '其他';
      if (!groups[cat]) groups[cat] = {};
      groups[cat][name] = count;
    }

    var result = [];
    for (var cat in groups) {
      var items = Object.entries(groups[cat]);
      items.sort(function(a, b) { return b[1] - a[1]; });
      result.push({ category: cat, items: items });
    }

    var order = ['单双大小', '五行', '波色', '家禽野兽', '波色单双', '生肖', '尾数', '头数', '门数', '段数', '合数', '头单双'];
    result.sort(function(a, b) {
      var ia = order.indexOf(a.category);
      var ib = order.indexOf(b.category);
      if (ia === -1 && ib === -1) return a.category.localeCompare(b.category);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    currentResult = result;
    var html = '';
    result.forEach(function(group) {
      var maxCount = group.items.length > 0 ? group.items[0][1] : 0;
      var total = group.items.reduce(function(s, i) { return s + i[1]; }, 0);
      html += '<div class="result-card"><div class="r-top"><span>' + group.category + '</span><span class="r-count">' + total + '次</span></div><div class="r-items">';
      group.items.forEach(function(item) {
        var name = item[0];
        var count = item[1];
        var cls = (count === maxCount && count > 0) ? 'hot' : '';
        html += '<span class="' + cls + '">' + name + ' ' + count + '次</span>';
      });
      html += '</div></div>';
    });
    resultEl.innerHTML = html;
  }

  function saveHistory() {
    if (selectedList.length === 0) { toast('⚠️ 没有数据可保存'); return; }
    var text = selectedList.join('、');
    var history = JSON.parse(localStorage.getItem('pick_history') || '[]');
    history.unshift({ time: getTimeStr(), text: text, data: selectedList.slice() });
    if (history.length > 50) history.length = 50;
    localStorage.setItem('pick_history', JSON.stringify(history));
    toast('💾 已保存到历史记录');
  }

  function formatResult() {
    if (currentResult.length === 0) return '暂无统计结果';
    var text = '🎯 挑码助手 统计结果\n' + getTimeStr() + '\n共 ' + selectedList.length + ' 次\n\n';
    currentResult.forEach(function(group) {
      var total = group.items.reduce(function(s, i) { return s + i[1]; }, 0);
      text += '【' + group.category + '】' + total + '次\n';
      group.items.forEach(function(item) {
        text += '  ' + item[0] + '：' + item[1] + '次\n';
      });
      text += '\n';
    });
    text += '📝 原始：' + selectedList.join('、');
    return text;
  }

  function showHistory() {
    var history = JSON.parse(localStorage.getItem('pick_history') || '[]');
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var html = '<div class="modal-content"><div class="modal-title">📜 历史记录</div><div class="history-top"><span style="font-size:9px;color:rgba(0,0,0,0.2)">共' + history.length + '条</span><button class="history-clear-btn" id="clearHistoryBtn">清空全部</button></div>';
    if (history.length === 0) {
      html += '<div style="text-align:center;color:rgba(0,0,0,0.10);padding:20px;font-size:13px;">暂无记录</div>';
    } else {
      history.slice(0, 30).forEach(function(h, i) {
        html += '<div class="history-item" data-idx="' + i + '"><div class="history-time">' + h.time + '</div><div class="history-text">' + h.text + '</div></div>';
      });
    }
    html += '<button class="modal-close-btn">关闭</button></div>';
    overlay.innerHTML = html;
    document.body.appendChild(overlay);

    overlay.querySelector('.modal-close-btn').addEventListener('click', function() { overlay.remove(); });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

    overlay.querySelectorAll('.history-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var h = history[parseInt(this.dataset.idx)];
        if (h && h.data) {
          selectedList = h.data.slice();
          updateUI();
          overlay.remove();
          toast('📥 已恢复');
          doStats();
        }
      });
    });

    var clearBtnHist = overlay.querySelector('#clearHistoryBtn');
    if (clearBtnHist) {
      clearBtnHist.addEventListener('click', function() {
        if (confirm('确定清空所有历史记录吗？')) {
          localStorage.removeItem('pick_history');
          overlay.remove();
          toast('🗑️ 已清空');
        }
      });
    }
  }

  // 按钮点击 +1
  document.querySelectorAll('.btn-grid button').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var val = this.dataset.value;
      if (val) addItem(val);
    });
    // 长按删除最后一个（移动端）
    var timer = null;
    btn.addEventListener('touchstart', function(e) {
      var val = this.dataset.value;
      if (!val) return;
      timer = setTimeout(function() {
        deleteLastItem();
        timer = null;
      }, 500);
    });
    btn.addEventListener('touchend', function() {
      if (timer) { clearTimeout(timer); timer = null; }
    });
    btn.addEventListener('touchmove', function() {
      if (timer) { clearTimeout(timer); timer = null; }
    });
    // 右键删除最后一个（桌面）
    btn.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      deleteLastItem();
    });
  });

  document.getElementById('deleteBtn').addEventListener('click', deleteLastItem);
  document.getElementById('copyBtn').addEventListener('click', function() {
    var text = formatResult();
    if (text === '暂无统计结果') { toast('⚠️ 请先选号'); return; }
    copyText(text);
  });
  document.getElementById('saveBtn').addEventListener('click', saveHistory);
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('historyBtn').addEventListener('click', showHistory);

  document.getElementById('titleBtn').addEventListener('dblclick', showHistory);
  var titleTimer = null;
  document.getElementById('titleBtn').addEventListener('touchstart', function() {
    titleTimer = setTimeout(showHistory, 600);
  });
  document.getElementById('titleBtn').addEventListener('touchend', function() {
    clearTimeout(titleTimer);
  });
  document.getElementById('titleBtn').addEventListener('touchmove', function() {
    clearTimeout(titleTimer);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { clearAll(); }
    if (e.key === 'Backspace' && !e.target.matches('textarea, input')) {
      e.preventDefault();
      deleteLastItem();
    }
  });

  updateUI();
  console.log('🎯 挑码助手已加载');
  console.log('💡 点击按钮选号 | 长按/右键删除最后一个');
  console.log('💡 双击标题查看历史记录');
  console.log('💡 点击「保存」才会存入历史');
  console.log('⌨️  Backspace 删除最后一个 | ESC 清空');
</script>
</body>
</html>
