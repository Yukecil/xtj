<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>挑码助手</title>
  <meta name="theme-color" content="#f5f5f5">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ===== 顶部导航 ===== */
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header .title {
      font-size: 18px;
      font-weight: 700;
      color: #333;
    }

    /* ===== 操作按钮行 - 只有删除和清空 ===== */
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .action-bar button {
      height: 44px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.1s;
    }
    .action-bar button:active {
      transform: scale(0.94);
      opacity: 0.8;
    }
    .action-bar .btn-delete {
      background: #ff5d88;
      color: #fff;
    }
    .action-bar .btn-clear {
      background: #fff;
      border: 1.5px solid #ff5d88;
      color: #ff5d88;
    }

    /* ===== 已选显示区域 ===== */
    .info-panel {
      padding: 12px 16px;
      background: #fff;
    }
    .selected-display {
      position: relative;
      height: 200px;
      border-radius: 14px;
      background: #fafafa;
      border: 1px solid #e8e8e8;
      overflow: hidden;
    }
    #selectedText {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      font-size: 17px;
      line-height: 32px;
      color: #333;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #selectedText::placeholder {
      color: #bbb;
    }

    /* ===== 统计结果区域 ===== */
    .result-wrapper {
      margin: 12px 16px;
      padding: 12px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #eee;
      min-height: 100px;
      max-height: 320px;
      overflow-y: auto;
    }
    .result-wrapper::-webkit-scrollbar {
      width: 3px;
    }
    .result-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .result-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 2px;
    }

    .result-card {
      background: #fafafa;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid #eee;
      min-height: 52px;
    }
    .result-card:last-child {
      margin-bottom: 0;
    }
    .result-card .r-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.3);
      margin-bottom: 6px;
    }
    .result-card .r-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .result-card .r-items span {
      padding: 4px 12px;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      color: #555;
      border: 1px solid #e8e8e8;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
    }
    .result-card .r-items span.hot {
      background: rgba(255, 93, 136, 0.1);
      border-color: #ff5d88;
      color: #ff5d88;
    }
    .result-card .r-count {
      font-weight: 600;
      font-size: 13px;
      color: #ff5d88;
    }
    .empty-result {
      padding: 20px;
      text-align: center;
      color: rgba(0, 0, 0, 0.15);
      font-size: 13px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== 按钮网格 ===== */
    .btn-section {
      background: #fff;
      padding: 4px 16px 8px 16px;
    }
    .btn-section:last-child {
      padding-bottom: 30px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      padding: 6px 0;
    }

    .btn-grid button {
      height: 46px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #dcdcdc;
      font-size: 16px;
      font-weight: 500;
      color: #333;
      transition: 0.1s;
      cursor: pointer;
      user-select: none;
      -webkit-touch-callout: none;
      position: relative;
    }
    .btn-grid button:active {
      transform: scale(0.92);
    }
    .btn-grid button.flash {
      animation: flashBtn 0.25s ease;
    }
    @keyframes flashBtn {
      0% { background: #ff5d88; border-color: #ff5d88; color: #fff; transform: scale(0.92); }
      100% { background: #fff; border-color: #dcdcdc; color: #333; transform: scale(1); }
    }

    .section-label {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.2);
      padding: 8px 0 2px 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(40, 40, 40, 0.92);
      color: #fff;
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 99999;
      animation: toastIn 0.2s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 400px) {
      .btn-grid {
        gap: 8px;
      }
      .btn-grid button {
        height: 40px;
        font-size: 14px;
        border-radius: 8px;
      }
      .action-bar {
        gap: 8px;
        padding: 10px 12px;
      }
      .action-bar button {
        height: 38px;
        font-size: 14px;
      }
      .selected-display {
        height: 160px;
      }
      #selectedText {
        font-size: 15px;
        line-height: 28px;
        padding: 12px;
      }
      .header .title {
        font-size: 16px;
      }
      .btn-section {
        padding: 4px 12px 6px 12px;
      }
      .result-wrapper {
        padding: 10px;
        margin: 10px 12px;
      }
      .result-card {
        padding: 10px 12px;
      }
      .result-card .r-items span {
        font-size: 12px;
        padding: 3px 10px;
      }
    }
    @media (max-width: 360px) {
      .btn-grid {
        gap: 6px;
      }
      .btn-grid button {
        height: 34px;
        font-size: 12px;
        border-radius: 6px;
      }
      .action-bar {
        gap: 5px;
        padding: 8px 10px;
      }
      .action-bar button {
        height: 34px;
        font-size: 13px;
      }
      .selected-display {
        height: 140px;
      }
      #selectedText {
        font-size: 13px;
        line-height: 24px;
        padding: 10px;
      }
      .btn-section {
        padding: 4px 10px 4px 10px;
      }
      .result-wrapper {
        padding: 8px;
        margin: 8px 10px;
      }
      .result-card {
        padding: 8px 10px;
      }
      .result-card .r-items span {
        font-size: 11px;
        padding: 2px 8px;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ===== 顶部导航 ===== -->

  </div>

      <button data-value="家禽">家禽</button>
      <button data-value="野兽">野兽</button>
      <button data-value="红单">红单</button>
      <button data-value="红双">红双</button>
      <button data-value="蓝单">蓝单</button>
      <button data-value="蓝双">蓝双</button>
      <button data-value="绿单">绿单</button>
      <button data-value="绿双">绿双</button>

  <div class="btn-section">

      <button data-value="羊">羊</button>
      <button data-value="猴">猴</button>
      <button data-value="鸡">鸡</button>
      <button data-value="狗">狗</button>

  <div class="btn-section">

      <button data-value="9合">9合</button>
      <button data-value="10合">10合</button>

  <div class="btn-section">
    <div class="section-label">头单 / 头双</div>
    <div class="btn-grid">
      <button data-value="0头单">0头单</button>
      <button data-value="1头单">1头单</button>
      <button data-value="2头单">2头单</button>
      <button data-value="3头单">3头单</button>
      <button data-value="4头单">4头单</button>
      <button data-value="0头双">0头双</button>
      <button data-value="1头双">1头双</button>
      <button data-value="2头双">2头双</button>
      <button data-value="3头双">3头双</button>
      <button data-value="4头双">4头双</button>
    </div>
  </div>

</div>

<script>
  // ========== 分类映射 ==========
  const CATEGORY_MAP = {
    '单': '单双大小', '双': '单双大小', '大单': '单双大小', '大双': '单双大小',
    '合单': '单双大小', '合双': '单双大小', '大': '单双大小', '小': '单双大小',
    '小单': '单双大小', '小双': '单双大小', '合大': '单双大小', '合小': '单双大小',
    '金': '五行', '木': '五行', '水': '五行', '火': '五行', '土': '五行',
    '红波': '波色', '蓝波': '波色', '绿波': '波色',
    '家禽': '家禽野兽', '野兽': '家禽野兽',
    '红单': '波色单双', '红双': '波色单双', '蓝单': '波色单双', '蓝双': '波色单双',
    '绿单': '波色单双', '绿双': '波色单双',
    '鼠': '生肖', '牛': '生肖', '虎': '生肖', '兔': '生肖', '龙': '生肖',
    '蛇': '生肖', '马': '生肖', '羊': '生肖', '猴': '生肖', '鸡': '生肖',
    '狗': '生肖', '猪': '生肖',
    '0尾': '尾数', '1尾': '尾数', '2尾': '尾数', '3尾': '尾数', '4尾': '尾数',
    '5尾': '尾数', '6尾': '尾数', '7尾': '尾数', '8尾': '尾数', '9尾': '尾数',
    '大尾': '尾数', '小尾': '尾数',
    '0头': '头数', '1头': '头数', '2头': '头数', '3头': '头数', '4头': '头数',
    '1门': '门数', '2门': '门数', '3门': '门数', '4门': '门数', '5门': '门数',
    '1段': '段数', '2段': '段数', '3段': '段数', '4段': '段数',
    '5段': '段数', '6段': '段数', '7段': '段数',
    '1合': '合数', '2合': '合数', '3合': '合数', '4合': '合数',
    '5合': '合数', '6合': '合数', '7合': '合数', '8合': '合数',
    '9合': '合数', '10合': '合数', '11合': '合数', '12合': '合数', '13合': '合数',
    '0头单': '头单双', '1头单': '头单双', '2头单': '头单双', '3头单': '头单双', '4头单': '头单双',
    '0头双': '头单双', '1头双': '头单双', '2头双': '头单双', '3头双': '头单双', '4头双': '头单双'
  };

  let selectedList = [];
  let currentResult = [];
  let toastTimer = null;

  const textarea = document.getElementById('selectedText');
  const resultEl = document.getElementById('result');

  // ========== Toast ==========
  function toast(text) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    if (toastTimer) clearTimeout(toastTimer);
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerText = text;
    document.body.appendChild(el);
    toastTimer = setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s';
      setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
    }, 1500);
  }

  // ========== 添加 ==========
  function addItem(value) {
    selectedList.push(value);
    updateUI();
    doStats();
    // 按钮闪一下
    document.querySelectorAll('.btn-grid button').forEach(function(btn) {
      if (btn.dataset.value === value) {
        btn.classList.remove('flash');
        void btn.offsetWidth;
        btn.classList.add('flash');
        setTimeout(function() {
          btn.classList.remove('flash');
        }, 300);
      }
    });
  }

  // ========== 删除最后一个 ==========
  function deleteLastItem() {
    if (selectedList.length === 0) {
      toast('⚠️ 没有可删除的');
      return;
    }
    var removed = selectedList.pop();
    updateUI();
    doStats();
    toast('➖ 已删除: ' + removed);
  }

  // ========== 清空全部 ==========
  function clearAll() {
    if (selectedList.length === 0) {
      toast('⚠️ 没有数据');
      return;
    }
    selectedList = [];
    updateUI();
    resultEl.innerHTML = '<div class="empty-result">选号后自动统计</div>';
    currentResult = [];
    toast('🗑️ 已清空');
  }

  // ========== UI更新 ==========
  function updateUI() {
    if (selectedList.length === 0) {
      textarea.value = '';
    } else {
      textarea.value = selectedList.join('、');
    }
    textarea.scrollTop = textarea.scrollHeight;
  }

  // ========== 统计 ==========
  function doStats() {
    if (selectedList.length === 0) {
      resultEl.innerHTML = '<div class="empty-result">选号后自动统计</div>';
      currentResult = [];
      return;
    }

    var countMap = {};
    selectedList.forEach(function(item) {
      if (!countMap[item]) countMap[item] = 0;
      countMap[item]++;
    });

    var groups = {};
    for (var name in countMap) {
      var count = countMap[name];
      var cat = CATEGORY_MAP[name] || '其他';
      if (!groups[cat]) groups[cat] = {};
      groups[cat][name] = count;
    }

    var result = [];
    for (var cat in groups) {
      var items = Object.entries(groups[cat]);
      items.sort(function(a, b) { return b[1] - a[1]; });
      result.push({ category: cat, items: items });
    }

    var order = ['单双大小', '五行', '波色', '家禽野兽', '波色单双', '生肖', '尾数', '头数', '门数', '段数', '合数', '头单双'];
    result.sort(function(a, b) {
      var ia = order.indexOf(a.category);
      var ib = order.indexOf(b.category);
      if (ia === -1 && ib === -1) return a.category.localeCompare(b.category);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    currentResult = result;
    var html = '';
    result.forEach(function(group) {
      var maxCount = group.items.length > 0 ? group.items[0][1] : 0;
      var total = group.items.reduce(function(s, i) { return s + i[1]; }, 0);
      html += '<div class="result-card"><div class="r-top"><span>' + group.category + '</span><span class="r-count">' + total + '次</span></div><div class="r-items">';
      group.items.forEach(function(item) {
        var name = item[0];
        var count = item[1];
        var cls = (count === maxCount && count > 0) ? 'hot' : '';
        html += '<span class="' + cls + '">' + name + ' ' + count + '次</span>';
      });
      html += '</div></div>';
    });
    resultEl.innerHTML = html;
  }

  // ========== 事件绑定 ==========

  // 按钮点击选号
  document.querySelectorAll('.btn-grid button').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var val = this.dataset.value;
      if (val) addItem(val);
    });

    // 长按删除最后一个（移动端）
    var timer = null;
    btn.addEventListener('touchstart', function(e) {
      var val = this.dataset.value;
      if (!val) return;
      timer = setTimeout(function() {
        deleteLastItem();
        timer = null;
      }, 500);
    });
    btn.addEventListener('touchend', function() {
      if (timer) { clearTimeout(timer); timer = null; }
    });
    btn.addEventListener('touchmove', function() {
      if (timer) { clearTimeout(timer); timer = null; }
    });

    // 右键删除最后一个（桌面）
    btn.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      deleteLastItem();
    });
  });

  // 操作按钮
  document.getElementById('deleteBtn').addEventListener('click', deleteLastItem);
  document.getElementById('clearBtn').addEventListener('click', clearAll);

  // 键盘快捷键
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { clearAll(); }
    if (e.key === 'Backspace' && !e.target.matches('textarea, input')) {
      e.preventDefault();
      deleteLastItem();
    }
  });

  // ========== 初始化 ==========
  updateUI();
  console.log('🎯 挑码助手已加载');
  console.log('💡 点击按钮选号 | 长按/右键删除最后一个');
  console.log('⌨️  Backspace 删除 | ESC 清空');
</script>
</body>
</html>
